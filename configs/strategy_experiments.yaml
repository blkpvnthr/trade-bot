# configs/strategy_experiments.yaml
#
# Config-driven strategy variant definitions.
# Each variant maps to a strategy_id + optional param overrides.
#
# run.py reads this when CONFIG_PATH is set and routes signals through
# the named strategy instead of the default scanner.
#
# Environment variable wiring:
#   STRATEGY_ID=tux_mtf_original CONFIG_PATH=configs/strategy_experiments.yaml PAPER_ONLY=true python run.py

variants:

  # ── bot-01: Conservative (TUX Multi-Timeframe) ────────────────────────────

  tux_mtf_original:
    strategy_id: tux_mtf_original
    description: "TUX MTF long+short, requires 2 confirming TFs"
    credential_set: bot01          # maps to K8s secret alpaca-paper-bot-tux-mtf
    params:
      fast_ema: 9
      slow_ema: 21
      trend_ema: 50
      n_confirm_tfs: 2
      atr_stop_mult: 1.5
      atr_target_mult: 3.0
      min_volume_mult: 1.2
      allow_shorts: true

  tux_mtf_long_only:
    strategy_id: tux_mtf_long_only
    description: "TUX MTF long-only, relaxed confirmation"
    credential_set: bot01
    params:
      fast_ema: 9
      slow_ema: 21
      trend_ema: 50
      n_confirm_tfs: 1
      atr_stop_mult: 1.2
      atr_target_mult: 2.5
      min_volume_mult: 1.1
      allow_shorts: false

  # ── bot-02: Aggressive (Pivot + ORB) ─────────────────────────────────────

  pivot_points:
    strategy_id: pivot_points
    description: "Floor-trader pivot bounce and breakout"
    credential_set: bot02          # maps to K8s secret alpaca-paper-bot-pivot-orb
    params:
      use_fib: false
      bounce_buffer_pct: 0.002
      breakout_confirm_pct: 0.001
      volume_confirm_mult: 1.1
      atr_stop_mult: 1.0
      atr_target_mult: 2.0
      allow_shorts: true

  orb_8am:
    strategy_id: orb_8am
    description: "30-minute opening range breakout from 8am ET"
    credential_set: bot02
    params:
      orb_start_hour: 8
      orb_start_minute: 0
      orb_minutes: 30
      atr_stop_mult: 0.5
      atr_target_mult: 1.0
      target_range_mult: 1.0
      volume_confirm_mult: 1.3
      allow_shorts: true
      max_entries_per_day: 2
      no_trade_after_hour: 14

  # ── bot-03: Experimental (Liquidity Sweep + Flawless Victory) ─────────────

  liquidity_sweep:
    strategy_id: liquidity_sweep
    description: "Smart money sweep reversal — buyside/sellside"
    credential_set: bot03          # maps to K8s secret alpaca-paper-bot-experimental
    params:
      swing_lookback: 10
      sweep_wick_pct: 0.001
      atr_stop_mult: 0.75
      atr_target_mult: 2.0
      volume_confirm_mult: 1.0
      volume_lookback: 20
      allow_shorts: true
      max_sweep_age_bars: 8

  flawless_victory:
    strategy_id: flawless_victory
    description: "All-6-conditions required — fires rarely, high conviction"
    credential_set: bot03
    params:
      fast_ema: 9
      slow_ema: 21
      rsi_period: 14
      rsi_buy_min: 40
      rsi_buy_max: 68
      rsi_short_min: 32
      rsi_short_max: 60
      volume_spike_mult: 1.5
      volume_lookback: 20
      atr_expand_lookback: 5
      pivot_proximity_pct: 0.004
      pivot_lookback: 15
      atr_stop_mult: 1.0
      atr_target_mult: 2.5
      allow_shorts: true

  alpaca_daily_income:
    strategy_id: alpaca_daily_income
    description: "Paper-only long intraday ORB/VWAP/premarket breakout objective with bracket-ready levels"
    credential_set: paper
    params:
      min_price: 5.0
      orb_minutes: 5
      no_entry_before: "09:35"
      no_entry_after: "15:30"
      min_relative_volume: 1.5
      min_risk_reward: 1.5
      target_risk_reward: 2.0
      max_entries_per_day: 3

# ── Optimization objective ────────────────────────────────────────────────────
optimization_objective:
  description: >
    Build a self-improving quantitative trading system capable of generating
    consistent risk-adjusted returns through autonomous research, strategy
    evaluation, and adaptive execution. The goal is long-term adaptive
    compounding — NOT raw return alone. Profits are never guaranteed.
  research_target:
    # Aspirational paper-trading benchmark only — not a hard target.
    avg_daily_pnl_usd_low: 400
    avg_daily_pnl_usd_high: 500
  optimize_for:
    - sharpe_ratio               # primary — risk-adjusted return
    - daily_pnl_consistency      # stable profitable trading days
    - max_drawdown               # controlled losses, capital stability
    - profit_factor              # positive expectancy
    - calmar_ratio               # return / max-drawdown efficiency
    - alpha_decay                # reward improving, penalize decaying strategies
    - trade_frequency_per_day    # execution quality, no overtrading
    - walk_forward_oos_sharpe    # robustness across walk-forward windows
    - return_volatility          # low variance of daily returns
  penalize:
    - unstable_returns           # high return_volatility relative to avg_daily_pnl
    - excessive_drawdowns        # large max_drawdown relative to total return
    - overtrading                # trade_frequency_per_day above threshold
    - correlated_losses          # multiple variants losing together (capital_allocator)
    - alpha_decay                # recent_sharpe degrading vs full-period Sharpe
    - skipped_signal_noise       # excessive skipped_signal_count vs trade_count
    - poor_oos_performance       # walk_forward_oos_sharpe < 0
  explicitly_avoid:
    - martingale_behavior
    - revenge_trading
    - unlimited_averaging_down
    - unsafe_leverage
    - uncapped_exposure
    - uncontrolled_overnight_risk
    - removing_kill_switches
    - weakening_paper_trading_safeguards

# ── Evaluation settings ───────────────────────────────────────────────────────
evaluation:
  metrics:
    - composite_score           # PRIMARY ranking metric — multi-factor weighted score
    - sharpe_ratio
    - calmar_ratio
    - max_drawdown
    - profit_factor
    - win_rate
    - daily_pnl_consistency     # fraction of trading days with positive P&L
    - avg_daily_pnl             # mean daily P&L in dollars
    - return_volatility         # std of daily P&L (lower is better)
    - trade_frequency_per_day   # trades per trading day (overtrading monitor)
    - alpha_decay               # recent_sharpe_7d / full_period_sharpe
    - recent_sharpe_7d          # 7-day rolling Sharpe
    - skipped_signal_count      # skipped signals in lookback window
    - walk_forward_oos_sharpe   # out-of-sample Sharpe from walk-forward
    - total_return
    - mae_avg                   # mean adverse excursion
    - mfe_avg                   # mean favorable excursion
    - trade_count
    - exposure_pct              # avg % of session in a position
    - daily_loss_violations     # days the kill switch would have fired

  lookback_days: 30
  min_trades_for_ranking: 5    # variants with fewer trades are unranked
  promote_threshold_sharpe: 1.5
  promote_threshold_profit_factor: 1.3
  promote_threshold_composite_score: 0.35  # composite_score >= 0.35 to be promotion-eligible

  # Composite score weights. Must sum to 1.0.
  # Strategies are ranked by composite_score — NOT raw Sharpe alone.
  # Adjust weights here to shift the optimization emphasis; no code changes needed.
  composite_score_weights:
    sharpe:            0.30   # risk-adjusted return — primary signal
    consistency:       0.20   # stable profitable trading days
    profit_factor:     0.20   # positive expectancy
    calmar:            0.15   # return / drawdown capital efficiency
    return_volatility: 0.05   # penalize high return variance
    alpha_decay:       0.05   # reward improving, penalize decaying strategies
    overtrading:       0.03   # penalize trade_frequency_per_day > 8
    skipped_noise:     0.02   # penalize skipped >> trade count
    walk_forward_oos:  0.00   # set to 0.10 once walk-forward results accumulate
