# k8s/secrets.example.yaml
#
# Example Kubernetes Secrets for the three paper-trading credential sets.
# DO NOT commit real API keys. Replace all REPLACE_ME values before applying.
#
# Apply with:
#   kubectl apply -f k8s/secrets.example.yaml -n trade-research
#
# Or create directly (safer — never touches a file):
#   kubectl create secret generic alpaca-paper-bot-tux-mtf \
#     --from-literal=APCA_API_KEY_ID=YOUR_KEY \
#     --from-literal=APCA_API_SECRET_KEY=YOUR_SECRET \
#     --from-literal=APCA_API_BASE_URL=https://paper-api.alpaca.markets \
#     -n trade-research

---
apiVersion: v1
kind: Secret
metadata:
  name: alpaca-paper-bot-tux-mtf
  namespace: trade-research
  labels:
    app: quantumquant
    credential-set: bot01
type: Opaque
stringData:
  APCA_API_KEY_ID: "REPLACE_ME"
  APCA_API_SECRET_KEY: "REPLACE_ME"
  APCA_API_BASE_URL: "https://paper-api.alpaca.markets"
  APCA_PAPER: "true"

